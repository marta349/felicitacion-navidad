<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Feliz Navidad</title>

    <style>

        /* =====================================================
           BASE
        ===================================================== */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            overflow: hidden;

            background: #59738d;

            color: #f6f6f6;

            font-family: Arial, sans-serif;
        }


        /* =====================================================
           ESCENAS
        ===================================================== */

        .scene {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100vh;

            transition:
                opacity 1.2s ease,
                transform 1.2s cubic-bezier(.22, 1, .36, 1);
        }


        /* =====================================================
           ESCENA 1
        ===================================================== */

        .scene-one {
            z-index: 10;

            opacity: 1;

            transform:
                scale(1)
                translateY(0);
        }


        /* =====================================================
           ESCENA 2
        ===================================================== */

        .scene-two {
            z-index: 5;

            opacity: 0;

            transform:
                scale(.97)
                translateY(30px);

            pointer-events: none;
        }

        body.show-tree .scene-one {
            opacity: 0;

            transform:
                scale(1.06)
                translateY(-25px);

            pointer-events: none;
        }

        body.show-tree .scene-two {
            opacity: 1;

            transform:
                scale(1)
                translateY(0);

            pointer-events: auto;
        }


        /* =====================================================
           ESCENA 3
        ===================================================== */

        .scene-three {
            z-index: 15;

            opacity: 0;

            transform:
                scale(.97)
                translateY(25px);

            pointer-events: none;
        }

        body.show-final .scene-one,
        body.show-final .scene-two {
            opacity: 0;

            pointer-events: none;
        }

        body.show-final .scene-three {
            opacity: 1;

            transform:
                scale(1)
                translateY(0);

            pointer-events: auto;
        }


        /* =====================================================
           NIEVE
        ===================================================== */

        .snow {
            position: fixed;

            top: -20px;

            width: 4px;
            height: 4px;

            border-radius: 50%;

            background: #f6f6f6;

            opacity: 0;

            pointer-events: none;

            z-index: 100;

            box-shadow:
                0 0 6px
                rgba(246,246,246,.55);

            animation:
                snowfall linear infinite;
        }

        @keyframes snowfall {

            0% {

                transform:
                    translate3d(
                        0,
                        -30px,
                        0
                    );

                opacity: 0;
            }

            10% {

                opacity: .8;
            }

            50% {

                transform:
                    translate3d(
                        35px,
                        55vh,
                        0
                    );
            }

            90% {

                opacity: .8;
            }

            100% {

                transform:
                    translate3d(
                        -25px,
                        110vh,
                        0
                    );

                opacity: 0;
            }
        }


        /* =====================================================
           ESCENA 1 · CONTENIDO
        ===================================================== */

        .scene-one-content {

            width: 100%;
            height: 100%;

            display: flex;

            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;
        }

        .scene-one h1 {

            margin: 0 0 28px;

            font-size:
                clamp(
                    38px,
                    5vw,
                    60px
                );

            line-height: 1.1;

            font-weight: 800;

            letter-spacing: 1px;
        }

        .from {

            margin-bottom: 16px;

            font-size: 14px;

            line-height: 1.2;

            letter-spacing: 4px;

            text-transform: uppercase;

            opacity: .85;
        }

        .logo {

            width: 220px;

            max-width: 60vw;

            height: auto;

            display: block;
        }


        /* =====================================================
           ESCENA 1 · ÁREA ESTRELLA
        ===================================================== */

        .star-area {

            position: relative;

            width: 330px;
            height: 180px;

            margin-top: 15px;
        }


        /* =====================================================
           PARTÍCULAS
        ===================================================== */

        .particle {

            position: absolute;

            left: 50%;
            top: 50%;

            width: 5px;
            height: 5px;

            border-radius: 50%;

            background: #f6f6f6;

            box-shadow:

                0 0 5px
                rgba(246,246,246,.9),

                0 0 14px
                rgba(246,246,246,.55);

            opacity: 0;

            transform:
                translate(-50%, -50%)
                translate(
                    var(--start-x),
                    var(--start-y)
                )
                scale(0);

            transition:

                left 1.45s
                cubic-bezier(.16,1,.3,1),

                top 1.45s
                cubic-bezier(.16,1,.3,1),

                transform 1.45s
                cubic-bezier(.16,1,.3,1),

                opacity 1.15s ease,

                filter 1.15s ease;
        }

        .star-area.building .particle {

            left:
                calc(
                    50% +
                    var(--star-x)
                );

            top:
                calc(
                    50% +
                    var(--star-y)
                );

            opacity: 1;

            transform:
                translate(-50%, -50%)
                scale(
                    var(--particle-scale)
                );
        }


        /* =====================================================
           DESVANECIMIENTO ELEGANTE DE PARTÍCULAS
        ===================================================== */

        .star-area.hide-particles .particle {

            opacity: 0;

            transform:
                translate(-50%, -50%)
                scale(.72);

            filter:
                blur(1px);
        }


        /* =====================================================
           ESTRELLA REAL
        ===================================================== */

        .real-star {

            position: absolute;

            left: 50%;
            top: 50%;

            width: 108px;
            height: 108px;

            transform:
                translate(-50%, -50%)
                scale(.92);

            opacity: 0;

            pointer-events: none;

            filter:

                drop-shadow(
                    0 0 5px
                    rgba(246,246,246,.7)
                )

                drop-shadow(
                    0 0 14px
                    rgba(246,246,246,.45)
                )

                drop-shadow(
                    0 0 30px
                    rgba(246,246,246,.18)
                );

            z-index: 5;

            transition:

                opacity 1.15s ease,

                transform
                1.15s
                cubic-bezier(.22,1,.36,1),

                filter 1.15s ease;
        }

        .real-star svg {

            width: 100%;
            height: 100%;

            display: block;
        }

        .real-star polygon {

            fill: #f6f6f6;
        }


        /* =====================================================
           FUNDIDO PARTÍCULAS → ESTRELLA
        ===================================================== */

        .star-area.star-complete .real-star {

            opacity: .9;

            transform:
                translate(-50%, -50%)
                scale(1);

            filter:

                drop-shadow(
                    0 0 7px
                    rgba(246,246,246,.9)
                )

                drop-shadow(
                    0 0 20px
                    rgba(246,246,246,.6)
                )

                drop-shadow(
                    0 0 38px
                    rgba(246,246,246,.28)
                );
        }


        /* =====================================================
           BRILLO DE LA ESTRELLA
        ===================================================== */

        .star-glow {

            position: absolute;

            left: 50%;
            top: 50%;

            width: 130px;
            height: 130px;

            border-radius: 50%;

            transform:
                translate(-50%, -50%)
                scale(0);

            opacity: 0;

            pointer-events: none;

            background:
                radial-gradient(
                    circle,
                    rgba(246,246,246,.24),
                    rgba(246,246,246,.1) 35%,
                    transparent 72%
                );
        }

        .star-area.building .star-glow {

            animation:
                starGlow
                2.2s
                ease
                forwards;
        }

        @keyframes starGlow {

            0% {

                opacity: 0;

                transform:
                    translate(-50%, -50%)
                    scale(0);
            }

            35% {

                opacity: 1;

                transform:
                    translate(-50%, -50%)
                    scale(1);
            }

            100% {

                opacity: 0;

                transform:
                    translate(-50%, -50%)
                    scale(2.2);
            }
        }


        /* =====================================================
           ESCENA 2 · TEXTO
        ===================================================== */

        .scene-two-content {

            width: 100%;
            height: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;

            padding:
                45px 20px 0;

            text-align: center;
        }

        .message {

            position: relative;

            z-index: 20;

            width:
                min(
                    850px,
                    92vw
                );
        }

        .message h2 {

            margin: 0;

            font-size:
                clamp(
                    27px,
                    4vw,
                    46px
                );

            line-height: 1.15;

            font-weight: 800;

            opacity: 0;

            transform:
                translateY(-20px);
        }

        .message p {

            max-width: 700px;

            margin:
                17px auto 0;

            font-size:
                clamp(
                    13px,
                    1.5vw,
                    16px
                );

            line-height: 1.6;

            letter-spacing: 1px;

            opacity: 0;

            transform:
                translateY(-10px);
        }

        body.show-tree .message h2 {

            animation:
                messageIn
                1.1s
                ease
                .5s
                forwards;
        }

        body.show-tree .message p {

            animation:
                messageIn
                1s
                ease
                .85s
                forwards;
        }

        @keyframes messageIn {

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        /* =====================================================
           ÁRBOL ESPIRAL
        ===================================================== */

        .tree {

            position: relative;

            width: 600px;

            height: 500px;

            margin-top: 28px;

            --tree-scale: 1;

            transform:
                scale(var(--tree-scale));

            transform-origin:
                top center;
        }

        .tree-spiral {

            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            overflow: visible;
        }

        .spiral-line {

            fill: none;

            stroke:
                rgba(246,246,246,.38);

            stroke-width: 1.5;

            stroke-linecap: round;

            stroke-dasharray:
                5 9;

            opacity: 0;

            filter:
                drop-shadow(
                    0 0 6px
                    rgba(246,246,246,.3)
                );
        }

        .tree.drawing .spiral-line {

            animation:
                drawSpiral
                1.8s
                ease
                forwards;
        }

        @keyframes drawSpiral {

            from {

                opacity: 0;

                stroke-dashoffset: 1500;
            }

            15% {

                opacity: 1;
            }

            to {

                opacity: .7;

                stroke-dashoffset: 0;
            }
        }


        /* =====================================================
           BOLAS
           POSICIONES EXACTAS
        ===================================================== */

        .ornament {

            position: absolute;

            left: 50%;
            top: 50%;

            width: 42px;
            height: 42px;

            border:
                1px solid
                rgba(246,246,246,.82);

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 30% 25%,
                    rgba(246,246,246,.34),
                    rgba(246,246,246,.09) 45%,
                    rgba(246,246,246,.025) 72%
                );

            box-shadow:

                0 0 9px
                rgba(246,246,246,.22),

                inset 0 0 12px
                rgba(246,246,246,.08);

            opacity: 0;

            transform:

                translate(-50%, -50%)

                translate(
                    var(--start-x),
                    var(--start-y)
                )

                scale(.1)

                rotate(
                    var(--start-rotation)
                );

            transition:

                left .75s
                cubic-bezier(.16,1,.3,1),

                top .75s
                cubic-bezier(.16,1,.3,1),

                transform .75s
                cubic-bezier(.16,1,.3,1),

                opacity .35s ease;
        }

        .tree.ornaments-arriving .ornament {

            left:
                calc(
                    50% +
                    var(--x)
                );

            top:
                calc(
                    50% +
                    var(--y)
                );

            opacity: 1;

            transform:

                translate(-50%, -50%)

                scale(1)

                rotate(0);
        }


        /* =====================================================
           CASQUILLO
        ===================================================== */

        .ornament::before {

            content: "";

            position: absolute;

            left: 50%;
            top: -5px;

            width: 8px;
            height: 5px;

            transform:
                translateX(-50%);

            border:
                1px solid
                rgba(246,246,246,.8);

            border-bottom: 0;

            border-radius:
                3px 3px 0 0;
        }


        /* =====================================================
           ISOTIPO DENTRO DE LAS BOLAS
        ===================================================== */

        .ornament img {

            position: absolute;

            left: 50%;
            top: 50%;

            width: 28px;
            height: 28px;

            object-fit: contain;

            transform:
                translate(-50%, -50%);

            filter:

                drop-shadow(
                    0 0 4px
                    rgba(246,246,246,.9)
                )

                drop-shadow(
                    0 0 8px
                    rgba(246,246,246,.3)
                );
        }


        /* =====================================================
           BRILLO DEL ÁRBOL
        ===================================================== */

        .tree-glow {

            position: absolute;

            left: 50%;
            top: 48%;

            width: 360px;
            height: 430px;

            transform:
                translate(-50%, -50%);

            border-radius: 50%;

            background:
                radial-gradient(
                    ellipse,
                    rgba(246,246,246,.09),
                    transparent 68%
                );

            opacity: 0;

            pointer-events: none;
        }

        .tree.finished .tree-glow {

            animation:
                treeGlow
                1.5s
                ease
                .3s
                forwards;
        }

        @keyframes treeGlow {

            0% {

                opacity: 0;

                transform:
                    translate(-50%, -50%)
                    scale(.7);
            }

            40% {

                opacity: 1;

                transform:
                    translate(-50%, -50%)
                    scale(1);
            }

            100% {

                opacity: 0;

                transform:
                    translate(-50%, -50%)
                    scale(1.15);
            }
        }


        /* =====================================================
           ESTRELLA DEL ÁRBOL
        ===================================================== */

        .tree-star {

            position: absolute;

            left: 50%;
            top: -17px;

            width: 42px;
            height: 42px;

            opacity: 0;

            transform:

                translateX(-50%)
                scale(0)
                rotate(-30deg);

            filter:

                drop-shadow(
                    0 0 7px
                    rgba(246,246,246,.9)
                )

                drop-shadow(
                    0 0 20px
                    rgba(246,246,246,.55)
                );
        }

        .tree.finished .tree-star {

            animation:

                treeStarIn
                .55s
                cubic-bezier(.22,1,.36,1)
                .15s
                forwards;
        }

        .tree-star svg {

            width: 100%;
            height: 100%;
        }

        .tree-star polygon {

            fill: #f6f6f6;
        }

        @keyframes treeStarIn {

            0% {

                opacity: 0;

                transform:
                    translateX(-50%)
                    scale(0)
                    rotate(-30deg);
            }

            65% {

                opacity: 1;

                transform:
                    translateX(-50%)
                    scale(1.2)
                    rotate(10deg);
            }

            100% {

                opacity: 1;

                transform:
                    translateX(-50%)
                    scale(1)
                    rotate(0);
            }
        }


        /* =====================================================
           TRONCO
        ===================================================== */

        .trunk {

            position: absolute;

            left: 50%;
            bottom: 5px;

            width: 26px;
            height: 48px;

            transform:
                translateX(-50%)
                scaleY(0);

            transform-origin: bottom;

            border-radius: 3px;

            background:
                rgba(246,246,246,.15);

            opacity: 0;
        }

        .tree.finished .trunk {

            animation:
                trunkIn
                .4s
                ease
                .1s
                forwards;
        }

        @keyframes trunkIn {

            to {

                opacity: 1;

                transform:
                    translateX(-50%)
                    scaleY(1);
            }
        }


        /* =====================================================
           BASE
        ===================================================== */

        .tree-base {

            position: absolute;

            left: 50%;
            bottom: 0;

            width: 190px;
            height: 12px;

            transform:
                translateX(-50%)
                scaleX(0);

            border-radius: 50%;

            background:
                rgba(246,246,246,.13);

            filter: blur(3px);

            opacity: 0;
        }

        .tree.finished .tree-base {

            animation:
                baseIn
                .6s
                ease
                .15s
                forwards;
        }

        @keyframes baseIn {

            to {

                opacity: 1;

                transform:
                    translateX(-50%)
                    scaleX(1);
            }
        }


        /* =====================================================
           ESCENA 3 · MENSAJE FINAL
        ===================================================== */

        .scene-three-content {

            width: 100%;
            height: 100%;

            display: flex;

            flex-direction: column;

            justify-content: center;
            align-items: center;

            padding: 30px;

            text-align: center;
        }

        .final-message {

            max-width: 850px;
        }

        .final-message h2 {

            margin: 0;

            font-size:
                clamp(
                    28px,
                    4vw,
                    48px
                );

            line-height: 1.2;

            font-weight: 800;

            letter-spacing: .5px;

            opacity: 0;

            transform:
                translateY(25px);
        }

        .final-message p {

            margin:
                22px 0 0;

            font-size:
                clamp(
                    11px,
                    1.2vw,
                    14px
                );

            line-height: 1.4;

            letter-spacing: 4px;

            text-transform: uppercase;

            opacity: 0;

            transform:
                translateY(15px);
        }


        /* =====================================================
           ISOTIPO FINAL · MUY GRANDE
        ===================================================== */

        .final-isotipo {

            display: block;

            width: 220px;
            height: 220px;

            object-fit: contain;

            margin:
                30px auto 0;

            opacity: 0;

            transform:
                translateY(12px)
                scale(.8);

            filter:

                drop-shadow(
                    0 0 12px
                    rgba(246,246,246,.95)
                )

                drop-shadow(
                    0 0 28px
                    rgba(246,246,246,.5)
                )

                drop-shadow(
                    0 0 55px
                    rgba(246,246,246,.2)
                );
        }


        /* =====================================================
           ANIMACIONES ESCENA 3
        ===================================================== */

        body.show-final .final-message h2 {

            animation:

                finalMessageIn
                1.2s
                cubic-bezier(.22,1,.36,1)
                .25s
                forwards;
        }

        body.show-final .final-message p {

            animation:

                finalMessageIn
                1s
                cubic-bezier(.22,1,.36,1)
                .65s
                forwards;
        }

        body.show-final .final-isotipo {

            animation:

                finalIsotipoIn
                .9s
                cubic-bezier(.22,1,.36,1)
                1s
                forwards;
        }

        @keyframes finalMessageIn {

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }

        @keyframes finalIsotipoIn {

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        /* =====================================================
           MÓVIL
        ===================================================== */

        @media (max-width: 600px) {

            .scene-two-content {

                padding-top: 38px;
            }

            .message h2 {

                font-size: 26px;
            }

            .message p {

                font-size: 13px;
            }

            .tree {

                width: 600px;

                height: 500px;

                margin-top: 25px;
            }

            .ornament {

                width: 42px;
                height: 42px;
            }

            .ornament img {

                width: 28px;
                height: 28px;
            }

            .final-message h2 {

                font-size: 28px;
            }

            .final-message p {

                font-size: 10px;

                letter-spacing: 3px;
            }

            .final-isotipo {

                width: 170px;
                height: 170px;

                margin-top: 25px;
            }

            .real-star {

                width: 90px;
                height: 90px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         ESCENA 1
    ===================================================== -->

    <section class="scene scene-one">

        <main class="scene-one-content">

            <h1>
                🎄 Feliz Navidad ✨
            </h1>

            <div class="from">
                De parte de:
            </div>

            <img
                src="images/2.png"
                alt="Logotipo"
                class="logo"
            >

            <div
                class="star-area"
                id="starArea"
            >

                <div class="star-glow"></div>


                <!-- ESTRELLA REAL -->

                <div class="real-star">

                    <svg viewBox="0 0 100 100">

                        <polygon points="
                            50,3
                            61,36
                            97,36
                            68,57
                            79,92
                            50,71
                            21,92
                            32,57
                            3,36
                            39,36
                        "/>

                    </svg>

                </div>

            </div>

        </main>

    </section>


    <!-- =====================================================
         ESCENA 2
    ===================================================== -->

    <section class="scene scene-two">

        <main class="scene-two-content">

            <div class="message">

                <h2>
                    Gracias por seguir formando parte de nuestro camino.
                </h2>

                <p>
                    Cada proyecto, cada reto y cada logro compartido
                    nos impulsa a seguir creciendo.
                </p>

            </div>


            <!-- ÁRBOL -->

            <div
                class="tree"
                id="tree"
            >

                <svg
                    class="tree-spiral"
                    viewBox="0 0 600 500"
                    preserveAspectRatio="none"
                >

                    <path
                        id="spiralPath"
                        class="spiral-line"
                    />

                </svg>


                <div class="tree-glow"></div>


                <div class="tree-star">

                    <svg viewBox="0 0 100 100">

                        <polygon points="
                            50,3
                            61,36
                            97,36
                            68,57
                            79,92
                            50,71
                            21,92
                            32,57
                            3,36
                            39,36
                        "/>

                    </svg>

                </div>


                <div class="trunk"></div>

                <div class="tree-base"></div>

            </div>

        </main>

    </section>


    <!-- =====================================================
         ESCENA 3
    ===================================================== -->

    <section class="scene scene-three">

        <main class="scene-three-content">

            <div class="final-message">

                <h2>
                    Por un nuevo año lleno de ideas
                    y proyectos compartidos.
                </h2>

                <p>
                    FELICES FIESTAS
                </p>

                <img
                    src="images/isotipo blanco.png"
                    alt=""
                    class="final-isotipo"
                >

            </div>

        </main>

    </section>


    <script>


        /* =====================================================
           NIEVE
        ===================================================== */

        const snowCount = 32;


        for (
            let i = 0;
            i < snowCount;
            i++
        ) {

            const snow =
                document.createElement(
                    "div"
                );


            snow.className =
                "snow";


            const size =
                2.5 +
                Math.random() * 4;


            const duration =
                7 +
                Math.random() * 9;


            const delay =
                -(
                    Math.random() *
                    duration
                );


            snow.style.left =
                `${Math.random() * 100}%`;


            snow.style.width =
                `${size}px`;


            snow.style.height =
                `${size}px`;


            snow.style.animationDuration =
                `${duration}s`;


            snow.style.animationDelay =
                `${delay}s`;


            document.body.appendChild(
                snow
            );

        }


        /* =====================================================
           REFERENCIAS
        ===================================================== */

        const starArea =
            document.getElementById(
                "starArea"
            );


        const tree =
            document.getElementById(
                "tree"
            );


        const spiralPath =
            document.getElementById(
                "spiralPath"
            );


        /* =====================================================
           ESCALA RESPONSIVE DEL ÁRBOL
           TODO EL ÁRBOL SE REDUCE COMO UNA SOLA PIEZA
        ===================================================== */

        function ajustarArbolMovil() {

            if (
                window.innerWidth <= 600
            ) {

                const escala =
                    (
                        window.innerWidth *
                        0.94
                    )
                    /
                    600;


                tree.style.setProperty(
                    "--tree-scale",
                    escala
                );

            } else {

                tree.style.setProperty(
                    "--tree-scale",
                    "1"
                );

            }

        }


        ajustarArbolMovil();


        window.addEventListener(
            "resize",
            ajustarArbolMovil
        );


        /* =====================================================
           ESTRELLA DE PARTÍCULAS
        ===================================================== */

        const starVertices = [];

        const outerRadius = 54;

        const innerRadius = 24;

        const starParticleCount = 110;


        for (
            let i = 0;
            i < 10;
            i++
        ) {

            const angle =
                (
                    -90 +
                    i * 36
                )
                *
                Math.PI
                /
                180;


            const radius =
                i % 2 === 0
                    ? outerRadius
                    : innerRadius;


            starVertices.push({

                x:
                    Math.cos(angle)
                    *
                    radius,

                y:
                    Math.sin(angle)
                    *
                    radius

            });

        }


        function createStarPoints(
            amount
        ) {

            const points = [];

            const lengths = [];

            let totalLength = 0;


            for (
                let i = 0;
                i < starVertices.length;
                i++
            ) {

                const a =
                    starVertices[i];


                const b =
                    starVertices[
                        (
                            i + 1
                        )
                        %
                        starVertices.length
                    ];


                const dx =
                    b.x - a.x;


                const dy =
                    b.y - a.y;


                const length =
                    Math.sqrt(
                        dx * dx +
                        dy * dy
                    );


                lengths.push(
                    length
                );


                totalLength +=
                    length;

            }


            for (
                let i = 0;
                i < amount;
                i++
            ) {

                const distance =
                    (
                        i / amount
                    )
                    *
                    totalLength;


                let accumulated = 0;


                for (
                    let side = 0;
                    side <
                    starVertices.length;
                    side++
                ) {

                    if (
                        distance <=
                        accumulated +
                        lengths[side]
                    ) {

                        const a =
                            starVertices[
                                side
                            ];


                        const b =
                            starVertices[
                                (
                                    side + 1
                                )
                                %
                                starVertices.length
                            ];


                        const progress =
                            (
                                distance -
                                accumulated
                            )
                            /
                            lengths[side];


                        points.push({

                            x:
                                a.x +
                                (
                                    b.x -
                                    a.x
                                )
                                *
                                progress,

                            y:
                                a.y +
                                (
                                    b.y -
                                    a.y
                                )
                                *
                                progress

                        });


                        break;

                    }


                    accumulated +=
                        lengths[side];

                }

            }


            return points;

        }


        const starPoints =
            createStarPoints(
                starParticleCount
            );


        starPoints.forEach(
            point => {

                const particle =
                    document.createElement(
                        "span"
                    );


                particle.className =
                    "particle";


                particle.style.setProperty(
                    "--start-x",
                    `${
                        (
                            Math.random() -
                            .5
                        )
                        *
                        420
                    }px`
                );


                particle.style.setProperty(
                    "--start-y",
                    `${
                        (
                            Math.random() -
                            .5
                        )
                        *
                        250
                    }px`
                );


                particle.style.setProperty(
                    "--star-x",
                    `${point.x}px`
                );


                particle.style.setProperty(
                    "--star-y",
                    `${point.y}px`
                );


                particle.style.setProperty(
                    "--particle-scale",
                    .55 +
                    Math.random() *
                    .9
                );


                particle.style.transitionDelay =
                    `${
                        Math.random() *
                        .25
                    }s`;


                starArea.appendChild(
                    particle
                );

            }
        );


        /* =====================================================
           ANIMACIÓN ESCENA 1
        ===================================================== */

        setTimeout(
            () => {

                starArea.classList.add(
                    "building"
                );

            },
            700
        );


        /* =====================================================
           APARICIÓN SUTIL DE LA ESTRELLA REAL
        ===================================================== */

        setTimeout(
            () => {

                starArea.classList.add(
                    "star-complete"
                );

            },
            2550
        );


        /* =====================================================
           DESVANECIMIENTO DE PARTÍCULAS
        ===================================================== */

        setTimeout(
            () => {

                starArea.classList.add(
                    "hide-particles"
                );

            },
            3000
        );


        /* =====================================================
           PASO AUTOMÁTICO ESCENA 1 → ESCENA 2
        ===================================================== */

        setTimeout(
            () => {

                document.body.classList.add(
                    "show-tree"
                );


                startTree();

            },
            4300
        );


        /* =====================================================
           ESPIRAL
        ===================================================== */

        const centerX = 300;

        const centerY = 250;

        const spiralTurns = 5.2;

        const spiralHeight = 410;

        const startRadius = 4;

        const endRadius = 250;

        const spiralSamples = 420;


        let spiralD = "";


        for (
            let i = 0;
            i < spiralSamples;
            i++
        ) {

            const progress =
                i /
                (
                    spiralSamples - 1
                );


            const angle =
                progress *
                Math.PI *
                2 *
                spiralTurns
                -
                Math.PI / 2;


            const radius =
                startRadius +
                progress *
                (
                    endRadius -
                    startRadius
                );


            const x =
                centerX +
                Math.cos(angle) *
                radius;


            const y =
                centerY -
                spiralHeight / 2 +
                progress *
                spiralHeight;


            spiralD +=

                i === 0

                    ? `M ${x} ${y}`

                    : ` L ${x} ${y}`;

        }


        spiralPath.setAttribute(
            "d",
            spiralD
        );


        /* =====================================================
           BOLAS
           EXACTAMENTE LAS MISMAS POSICIONES
        ===================================================== */

     const bolas = [

    { x: -40, y: -120 },
    { x: -85, y: -45 },
    { x: -133, y: 35 },
    { x: -180, y: 115 },
    { x: -224, y: 192 },
    { x: 50, y: 135 },
    { x: 155, y: 75 },
    { x: 240, y: 230 },
    { x: 200, y: 155 },
    { x: 0, y: 210 },
    { x: 112, y: -5 },
    { x: -30, y: 50 },
    { x: 65, y: -80 },
    { x: 16, y: -158 }

];


const bolasMobile = [

    { x: 45, y: -120 },   /* BOLA 1 */
    { x: -85, y: -45 },    /* BOLA 2 */
    { x: -133, y: 35 },    /* BOLA 3 */
    { x: -180, y: 115 },   /* BOLA 4 */
    { x: -224, y: 192 },   /* BOLA 5 */
    { x: 50, y: 135 },     /* BOLA 6 */
    { x: 155, y: 75 },     /* BOLA 7 */
    { x: 240, y: 230 },    /* BOLA 8 */
    { x: 200, y: 155 },    /* BOLA 9 */
    { x: 0, y: 210 },      /* BOLA 10 */
    { x: 112, y: -5 },     /* BOLA 11 */
    { x: -30, y: 50 },     /* BOLA 12 */
    { x: 65, y: -80 },     /* BOLA 13 */
    { x: 16, y: -158 }     /* BOLA 14 */

];


const posicionesBolas =
    window.innerWidth <= 600
        ? bolasMobile
        : bolas;


posicionesBolas.forEach(
            (bola, index) => {

                const ornament =
                    document.createElement(
                        "div"
                    );


                ornament.className =
                    "ornament";


                ornament.style.setProperty(
                    "--x",
                    `${bola.x}px`
                );


                ornament.style.setProperty(
                    "--y",
                    `${bola.y}px`
                );


                ornament.style.setProperty(
                    "--start-x",
                    `${
                        (
                            Math.random() -
                            .5
                        )
                        *
                        850
                    }px`
                );


                ornament.style.setProperty(
                    "--start-y",
                    `${
                        (
                            Math.random() -
                            .5
                        )
                        *
                        600
                    }px`
                );


                ornament.style.setProperty(
                    "--start-rotation",
                    `${
                        (
                            Math.random() -
                            .5
                        )
                        *
                        720
                    }deg`
                );


                ornament.style.transitionDelay =
                    `${
                        index *
                        .045
                    }s`;


                const image =
                    document.createElement(
                        "img"
                    );


                image.src =
                    "images/isotipo blanco.png";


                image.alt = "";


                ornament.appendChild(
                    image
                );


                tree.appendChild(
                    ornament
                );

            }
        );


        /* =====================================================
           FUNCIÓN DEL ÁRBOL
        ===================================================== */

        function startTree() {

            setTimeout(
                () => {

                    tree.classList.add(
                        "drawing"
                    );

                },
                300
            );


            setTimeout(
                () => {

                    tree.classList.add(
                        "ornaments-arriving"
                    );

                },
                1500
            );


            setTimeout(
                () => {

                    tree.classList.add(
                        "finished"
                    );

                },
                2600
            );


            /* ================================================
               ESCENA 2 → ESCENA 3
            ================================================= */

            setTimeout(
                () => {

                    document.body.classList.add(
                        "show-final"
                    );

                },
                6500
            );

        }

    </script>

</body>
